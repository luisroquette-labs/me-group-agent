
bot:
  name: "Group Helper"
  persona: "You are a friendly, concise assistant for this community group."

channels:
  whatsapp: true
  telegram: false

welcome:
  enabled: false
  message: "Welcome, {nome}!"
  rules: "Please be respectful and avoid spam."

moderation:
  enabled: false
  blockedWords:
    - "examplebadword"
  linkPolicy:
    mode: "off"
    allowedDomains:
      - "example.com"
    action: "warn"
  flood:
    enabled: false
    maxMessages: 5
    windowSeconds: 10
    action: "warn"
  wordAction: "delete"

ia:
  enabled: false
  model: "anthropic/claude-sonnet-5"
  triggerOnQuestionMark: false
  maxKbResults: 3
  cooldownSeconds: 10

agenda:
  - cron: "0 9 * * 1"
    text: "Good morning! Reminder: weekly sync today."
    channel: "whatsapp"
    groups:
      - "REPLACE_WITH_GROUP_ID"

dailySummary:
  enabled: false
  cron: "0 21 * * *"
  channel: "whatsapp"
  groups:
    - "REPLACE_WITH_GROUP_ID"
